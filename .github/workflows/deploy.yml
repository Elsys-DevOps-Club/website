name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Само preview-ята се прекъсват. Втори push към main не бива да спира
  # качване към Cloudflare по средата.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Пълната история: стъпката по-долу сравнява с origin/main.
          fetch-depth: 0

      # Името на файла в src/content/meetings/ е публичната котва на срещата
      # (meetingHref). Преименуване или изтриване чупи всеки споделен линк,
      # а билдът остава зелен — затова проверката е тук. При push в main
      # сравнението е със самия main, тоест празно; гледат се само PR-ите.
      - name: Check meeting slugs are unchanged
        if: github.event_name == 'pull_request'
        run: |
          renamed=$(git diff --diff-filter=RD --name-status origin/main...HEAD -- src/content/meetings/)
          if [ -n "$renamed" ]; then
            echo "Преименуван или изтрит файл на среща:"
            echo "$renamed"
            echo
            echo "Името на файла е публична котва (/meetings#<име на файла>)."
            echo "Смяната му чупи всеки споделен линк. Поправя се съдържанието, не името."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run build

      # Fork PRs have no access to secrets, so they only build.
      - name: Resolve branch
        id: branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.branch.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=devops-club-site --branch=${{ steps.branch.outputs.name }}

  # Синхронизацията с Discord е отделен workflow със свой токен. Тук само се
  # побутва, след като новата версия на сайта е качена. Отделен job, за да
  # има само той право да пуска workflow-и.
  discord-events:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discord-events.yml --repo "$GITHUB_REPOSITORY" --ref main
