name: Нещо не работи
description: Счупено или грешно на сайта.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Какво става
      description: Какво видя и какво очакваше да видиш.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Къде
      description: Адресът на страницата.
      placeholder: https://devops.elsys.club/meetings
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Устройство и браузър
      description: Телефон или компютър, кой браузър. Ако е въпрос на ширина, кажи я.
      placeholder: телефон, Chrome, около 375 px
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Друго
      description: Снимка на екрана помага много.
    validations:
      required: false
